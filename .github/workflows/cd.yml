name: Java 25 CD with Docker
on:
  push:
    branches:
      - main
      - develop
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          
      # 1. 테스트 및 빌드
      - name: Test and Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar --parallel
          
      # 2. 도커 허브 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          
      # 3. 도커 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
          
      # 4. 서버 배포
      - name: Deploy to NCP Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            
            echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            cd ~/app
            
            # 환경변수 파일 생성
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # docker-compose용 환경변수 추가 (이미지, 컨테이너명)
            echo "" >> .env
            echo "DOCKER_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest" >> .env
            echo "CONTAINER_NAME=${{ secrets.CONTAINER_NAME }}" >> .env
            
            # 최신 이미지 pull
            docker compose pull app
            
            # Spring 앱만 재시작
            docker compose up -d --no-deps --force-recreate app
            
            # Nginx 설정 리로드
            docker exec swyp-nginx nginx -s reload || true
            
            # 사용하지 않는 이미지 정리
            docker image prune -f