version: '3.8'

services:
  mysql-local:
    image: mysql:8.0
    container_name: keepit-mysql-local
    environment:
      MYSQL_ROOT_PASSWORD: localpassword
      MYSQL_DATABASE: swyp_db
      MYSQL_USER: localuser
      MYSQL_PASSWORD: localpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-local-data:
