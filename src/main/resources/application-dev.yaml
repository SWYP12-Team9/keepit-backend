server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:swyp_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: 30

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  sql:
    init:
      mode: never

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # 로컬 HTTP 개발환경
  security:
    cookie:
      refresh:
        secure: ${REFRESH_SECURE:false}
        same-site: ${REFRESH_SAME_SITE:Lax}
        max-age-seconds: ${REFRESH_COOKIE_MAX_AGE_SECONDS:60}
      oauth2:
        secure: ${OAUTH2_COOKIE_SECURE:false}
        same-site: ${OAUTH2_COOKIE_SAME_SITE:Lax}
        max-age-seconds: ${OAUTH2_COOKIE_MAX_AGE_SECONDS:180}
    oauth2:
      client:
        registration:
          # OAuth2 : NAVER registration
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: ${SERVER_URL}/api/v1/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - nickname

          # OAuth2 : Google registration
          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${SERVER_URL}/api/v1/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

          # OAuth2 : Kakao registration
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${SERVER_URL}/api/v1/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              #- account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  #          google:
  #            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
  #            token-uri: https://oauth2.googleapis.com/token
  #            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  #            user-name-attribute: sub
  #google: 생략 가능
  # Sring Security가 이미 알고있는 provider들
  # google, facebook, github
  # 그래서 따로 google은 추가안해도 된다.

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  # Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring AI 설정
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      elasticsearch:
        index-name: ${ELASTICSEARCH_INDEX_NAME:keepit-vectors}
        dimensions: 1536
        initialize-schema: true

# AI 개별 설정
ai:
  summary:
    temperature: ${AI_SUMMARY_TEMPERATURE:0.4}  # 요약용 temperature (낮을수록 일관적)
  chatbot:
    max-tokens: ${AI_CHATBOT_MAX_TOKENS:2000}  # 챗봇 응답 토큰 제한
    temperature: ${AI_CHATBOT_TEMPERATURE:0.7}  # 챗봇 temperature (자연스러운 대화)

# Frontend URL 설정
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

swagger:
  server-url: ${SERVER_URL:http://localhost:8080}

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# GCP Cloud Storage 설정
cloud:
  gcp:
    storage:
      project-id: ${GCP_PROJECT_ID}
      bucket-name: ${GCP_BUCKET_NAME}

# 이미지 업로드 설정
image:
  max-size: ${IMAGE_MAX_SIZE:10485760} # 10MB (byte 단위)
  allowed-types: image/jpeg,image/jpg,image/png,image/gif,image/webp
  directory: ${IMAGE_DIRECTORY:images} # 버킷 내 저장 경로

# 스크래핑 API 설정
scraping:
  api:
    base-url: ${SCRAPING_API_BASE_URL:http://localhost:8000}

link:
  stream:
    processing-state-ttl-minutes: ${LINK_STREAM_PROCESSING_STATE_TTL_MINUTES:30}
    trim:
      main-max-len: ${LINK_STREAM_TRIM_MAIN_MAX_LEN:50000}
      dlq-max-len: ${LINK_STREAM_TRIM_DLQ_MAX_LEN:5000}
    recovery:
      enabled: ${LINK_STREAM_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${LINK_STREAM_RECOVERY_DELAY_MS:10000}
      min-idle-seconds: ${LINK_STREAM_RECOVERY_MIN_IDLE_SECONDS:30}
      batch-size: ${LINK_STREAM_RECOVERY_BATCH_SIZE:20}
      max-delivery-count: ${LINK_STREAM_RECOVERY_MAX_DELIVERY_COUNT:5}
      backoff:
        enabled: ${LINK_STREAM_RECOVERY_BACKOFF_ENABLED:true}
        base-seconds: ${LINK_STREAM_RECOVERY_BACKOFF_BASE_SECONDS:30}
        multiplier: ${LINK_STREAM_RECOVERY_BACKOFF_MULTIPLIER:2.0}
        max-delay-seconds: ${LINK_STREAM_RECOVERY_BACKOFF_MAX_DELAY_SECONDS:300}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL:}
