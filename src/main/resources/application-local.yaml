server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/swyp_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: localuser
    password: localpassword

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  sql:
    init:
      mode: never

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # 로컬 HTTP 개발환경
  security:
    cookie:
      refresh:
        secure: false
        same-site: Lax
        max-age-seconds: 604800  # 7일
    oauth2:
      client:
        registration:
          # OAuth2 설정은 필요시 환경변수로 추가
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - nickname

          google:
            client-name: google
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email

          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small

  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    root: INFO
    swyp12.team9: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG

# Frontend URL 설정
frontend:
  url: http://localhost:5173

swagger:
  server-url: http://localhost:8080

# CORS 설정
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# NCP Object Storage 설정 (로컬 테스트시에는 사용 안함)
cloud:
  ncp:
    object-storage:
      endpoint: https://kr.object.ncloudstorage.com
      region: kr-standard
      credentials:
        access-key: ${NCP_ACCESS_KEY:dummy}
        secret-key: ${NCP_SECRET_KEY:dummy}
      bucket-name: ${NCP_BUCKET_NAME:dummy}

# 이미지 업로드 설정
image:
  max-size: 10485760 # 10MB (byte 단위)
  allowed-types: image/jpeg,image/jpg,image/png,image/gif,image/webp
  directory: images

# 파이썬 서버 설정 (추천/크롤링)
python:
  server:
    url: http://localhost:8000
