spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false

# CORS 설정 추가
cors:
  allowed-origins:
#    - http://localhost:5173
#    - http://localhost:3000
    - https://yourdomain.com

logging:
  level:
    root: WARN
    swyp12.team9: INFO
    org.hibernate.SQL: WARN