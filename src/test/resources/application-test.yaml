server:
  port: 8080

spring:
  application:
    name: server-test

  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: false

  sql:
    init:
      mode: never

  security:
    cookie:
      refresh:
        secure: false
        same-site: Lax
        max-age-seconds: 60
      oauth2:
        secure: false
        same-site: Lax
        max-age-seconds: 180
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
              - nickname
          google:
            client-name: google
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
          kakao:
            client-name: kakao
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: http://localhost:8080/api/v1/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  ai:
    openai:
      api-key: test-api-key
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
          max-tokens: 1000
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      elasticsearch:
        index-name: test-vectors
        dimensions: 1536
        initialize-schema: false

# AI 개별 설정
ai:
  summary:
    temperature: 0.4  # 요약용 temperature (낮을수록 일관적)
  chatbot:
    max-tokens: 2000  # 챗봇 응답 토큰 제한
    temperature: 0.7  # 챗봇 temperature (자연스러운 대화)

  elasticsearch:
    uris: http://localhost:9999

  data:
    redis:
      host: localhost
      port: 6379

scraping:
  api:
    base-url: http://localhost:8000

frontend:
  url: http://localhost:5173

swagger:
  server-url: http://localhost:8080

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

cloud:
  gcp:
    storage:
      project-id: test-project-id
      credentials:
        json:
      bucket-name: test-bucket

image:
  max-size: 10485760
  allowed-types: image/jpeg,image/jpg,image/png,image/gif,image/webp
  directory: images

logging:
  level:
    root: INFO
    swyp12.team9: DEBUG
    org.hibernate.SQL: DEBUG
