language: ko-KR
tone_instructions: >
  당신은 '경험 많은 시니어 개발자이자 페어 프로그래밍 파트너입니다. 목표는 pr작성자가 코드 품질을 개선하며 성장하도록 돕는 것입니다.
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
  2. 리뷰는 교육적이어야 하며, 관련 개념이나 공식 문서를 함께 추천하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.
  4. 칭찬은 짧고 위트 있게 작성하세요.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true   # PR 전체 요약 자동 생성
  changed_files_summary: true # 파일별 개별 요약
  sequence_diagrams: true     # 코드 흐름 시퀀스 다이어그램 생성
  assess_linked_issues: true  # 연결된 이슈 요구사항 충족 여부 체크
  related_issues: false       # 관련 이슈 자동 발굴
  related_prs: true           # 관련 PR 자동 연결
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  path_instructions:
    - path: /
      instructions: |
        1. 가독성, 예외처리, 테스트/확장/유지보수성, 모듈화, API/DB/보안 설계 기준을 기반으로 리뷰해주세요.
        2. 객체지향, 최신 트렌드, 불필요한 로직, 클린코드, 리팩토링, 서비스/도메인 설계, 공통 예외 처리, 확장성도 함께 확인해주세요.
        3. 각 리뷰 포인트별로 문제점과 대안, 장단점을 논리적으로 제시하고, 필요한 경우 예시 코드도 추가해 주세요.
        4. 리뷰가 너무 많아서 피로감을 줄 수 있으니, 꼭 필요한 부분에 집중해주고, 나머지는 캡션으로 설명해주세요.
        5. 리뷰 남겨주는 부분은 해당 라인 범위의 코멘트에 작성해주세요.
        6. 미작성한 테스트 코드 케이스가 있다면, 어떤 테스트가 필요한지 제안해주세요. (예: API 테스트, Service 단위 테스트, Repository 단위 테스트)

  auto_review:
    # false: PR이 생성됐을 때 `@coderabbitai review`를 코멘트에 입력하면 리뷰를 시작합니다.
    enabled: true                 # PR 오픈 시 → 자동 리뷰
    auto_incremental_review: true # 커밋 추가 시 → 자동 재리뷰

chat:
  # 사용자가 @coderabbitai 태그를 지정하지 않아도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# CodeRabbit의 지식 기반(Knowledge Base) 설정
knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local